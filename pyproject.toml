[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=8", "versioningit"]
build-backend = "setuptools.build_meta"

[project]
name = "dredge-ephys"
dynamic = ["version"]
authors = [{ name = "Charlie Windolf", email = "ciw2048@gmail.com" }]
description = "DREDge: Decentralized Registration for Electrophysiology Data (... ge)"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.20;python_version<'3.13'",
  "numpy>=2.0.0;python_version>='3.13'",
  "torch",
  "scipy>=1.13",
  "spikeinterface",
  "tqdm",
]

[project.urls]
"Homepage" = "https://github.com/cwindolf/dredge"
"Bug Tracker" = "https://github.com/cwindolf/dredge/issues"

[tool.versioningit]
# use their defaults

[tool.black]
line-length = 88
include = 'src\/.*\.pyi?$|tests\/.*\.pyi?$'

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E", "F", "I", "N", "B", "SIM", "NPY", "RUF", "PTH", "PD", "FURB"]
ignore = ["F722", "N812", "SIM102", "SIM103", "SIM105", "SIM108", "SIM114", "E501", "N806", "N803", "N815", "RUF005", "SIM300", "C408", "TRY401"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
